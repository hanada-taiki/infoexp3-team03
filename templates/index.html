
<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MiniBoard - Quiz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <main>
        <h1>MiniBoard - team03</h1>

        <!-- クイズ問題 -->
        <section id="quiz">
            <h2>4択クイズ</h2>
            <p>日本の首都はどこでしょう？</p>
            <ol>
                <li>大阪</li>
                <li>東京</li>
                <li>京都</li>
                <li>福岡</li>
            </ol>
        </section>

        <!-- 解答を投稿 -->
        <h2>解答を投稿</h2>

        <form id="form">
            <input
                id="name"
                maxlength="30"
                placeholder="Nickname"
                required
            >

            <textarea
                id="message"
                maxlength="300"
                placeholder="回答を入力してください"
                required
            ></textarea>

            <p id="char-count">0 / 300 文字</p>

            <button type="submit">解答を投稿</button>
        </form>

        <!-- 正誤判定 -->
        <p id="result" role="status" aria-live="polite"></p>

        <!-- 投稿結果 -->
        <p id="status" role="status" aria-live="polite"></p>

        <!-- 解答一覧 -->
        <h2>みんなの解答</h2>
        <section id="messages"></section>
    </main>

    <script src="/static/app.js"></script>
</body>

</html>
